[project]
name = "meet-among-us-ml"
version = "0.1.0"
description = "AI Meeting Intelligence Agent — speaker embedding / audio ML package"
requires-python = ">=3.11"
# Phase 4a: embedding + quality-gate pipeline, served as its own local HTTP process
# (see docs/adr/0014-ml-as-local-service.md) so torch/speechbrain never enter the
# backend's environment — the exact thing this package's isolation is for.
dependencies = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "speechbrain>=1.0",
    "silero-vad>=5.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# CPU-only per CLAUDE.md's locked decision — without this, plain PyPI torch pulls a
# multi-GB CUDA build neither needed nor usable without a GPU this milestone.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]
